<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обмін Подарунками</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Обмін Подарунками</h1>
        <div class="user-info">
            <p id="username">Користувач: Завантаження...</p>
            <p id="balance">Баланс Stars: Перевірка...</p>
        </div>

        <div id="main-menu" class="section active">
            <button id="createTradeBtn">Створити обмін</button>
            <button id="activeTradesBtn">Активні обміни</button>
            <button id="historyBtn">Історія обмінів</button>
        </div>

        <div id="create-trade" class="section">
            <h2>Створення обміну</h2>
            <div class="item-selection">
                <h3>Ваші пропозиції</h3>
                <div id="myItems" class="items-list"></div>
                <input type="text" id="itemName" placeholder="Назва подарунка">
                <input type="text" id="itemDescription" placeholder="Опис подарунка">
                <button id="addItemBtn">Додати подарунок</button>
            </div>
            <button id="createOfferBtn">Створити пропозицію</button>
            <button id="backFromCreateBtn" class="back-btn">Назад</button>
        </div>

        <div id="active-trades" class="section">
            <h2>Активні обміни</h2>
            <div id="tradesList" class="trades-list"></div>
            <button id="backFromActiveBtn" class="back-btn">Назад</button>
        </div>

        <div id="trade-details" class="section">
            <h2>Деталі обміну</h2>
            <div class="trade-info">
                <div class="sender-items">
                    <h3>Пропозиція</h3>
                    <div id="senderItemsList" class="items-list"></div>
                </div>
                <div class="receiver-items">
                    <h3>Ваша пропозиція</h3>
                    <div id="receiverItemsList" class="items-list"></div>
                    <div id="counterOffer" class="counter-offer">
                        <input type="text" id="counterItemName" placeholder="Назва подарунка">
                        <input type="text" id="counterItemDescription" placeholder="Опис подарунка">
                        <button id="addCounterItemBtn">Додати подарунок</button>
                    </div>
                </div>
            </div>
            <button id="confirmTradeBtn">Підтвердити (35 Stars)</button>
            <button id="cancelTradeBtn">Скасувати</button>
            <button id="backFromDetailsBtn" class="back-btn">Назад</button>
        </div>

        <div id="trade-history" class="section">
            <h2>Історія обмінів</h2>
            <div id="historyList" class="trades-list"></div>
            <button id="backFromHistoryBtn" class="back-btn">Назад</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
